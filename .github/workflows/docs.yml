name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "wolframclient/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group docs
      # same as a local build: sphinx-apidoc + sphinx-build -W (+ sass via npx)
      - run: bash docs/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
