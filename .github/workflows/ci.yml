name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv lock --check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "not kernel and not cloud" --cov --cov-report=term-missing:skip-covered

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - name: Wheel ships no tests and includes initkernel.m
        shell: bash
        run: |
          set -euo pipefail
          files=$(unzip -Z1 dist/*.whl)
          ! grep -q '^tests/' <<<"$files"
          grep -q 'wolframclient/evaluation/kernel/initkernel.m' <<<"$files"
